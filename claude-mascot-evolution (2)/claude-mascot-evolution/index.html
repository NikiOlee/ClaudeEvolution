<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ascent of the Mascot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="sub" aria-live="polite"></div>
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 100 100" width="120" height="120"><circle cx="50" cy="50" r="46" fill="#D97757" stroke="#2a1712" stroke-width="6"/><path d="M40 28 L74 50 L40 72 Z" fill="#fff" stroke="#2a1712" stroke-width="6" stroke-linejoin="round"/></svg>
    <span id="playlbl">PLAY</span>
  </button>
  <div id="bar">
    <button id="pp" title="Pause / resume (space)">❚❚</button>
    <div id="prog"><i id="progf"></i></div>
    <button id="cc" title="Subtitles on/off">CC</button>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
